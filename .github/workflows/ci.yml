name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: python -m pytest -q
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Score the example verifiers (hack-resistance gate on the isolated grader)
        run: python -m goodhart run examples/tasks --verifier isolated -j 4 --out results/ci --min-hack-resistance 1.0 --min-invariance 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goodhart-report
          path: results/ci
